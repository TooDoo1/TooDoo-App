<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TooDoo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0e1325;
    }
    #scene {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #0e1325;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    #center-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    #logo-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #logo-img {
      width: 200px;
      height: 200px;
      border-radius: 36px;
      object-fit: cover;
      display: block;
      opacity: 0;
      transform: scale(0.85);
      filter: brightness(0.15) saturate(0.2);
    }
    #logo-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 200px;
      height: 200px;
      border-radius: 36px;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85);
      transform-origin: center center;
    }
    #brand-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #fff;
      opacity: 0;
      transform: translateY(10px);
      text-shadow: 0 0 30px rgba(255,220,80,0);
    }
  </style>
</head>
<body>
  <div id="scene">
    <div id="center-wrap">
      <div id="logo-wrap">
        <div id="logo-glow"></div>
        <img id="logo-img" src="/icon-192.png" alt="TooDoo" />
      </div>
      <div id="brand-text">TooDoo</div>
    </div>
  </div>
  <script>
    let completeSignaled = false;
    let waitingPulse = false;
    let pulseRaf = null;

    function signalComplete() {
      if (completeSignaled) return;
      completeSignaled = true;
      try {
        window.parent.postMessage({ type: 'toodoo-intro-complete' }, '*');
      } catch (e) {}
      try {
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'toodoo-intro-complete' }));
        }
      } catch (e) {}
    }

    const logoImg = document.getElementById('logo-img');
    const logoGlow = document.getElementById('logo-glow');
    const brandText = document.getElementById('brand-text');

    function applyLogoGlow(intensity) {
      const gs = Math.round(8 + intensity * 16);
      const ga = (0.25 + intensity * 0.35).toFixed(2);
      const outer = (intensity * 0.18).toFixed(2);
      logoImg.style.filter =
        'brightness(100%) saturate(100%) drop-shadow(0 0 ' + gs + 'px rgba(255,220,80,' + ga + '))';
      logoGlow.style.opacity = '1';
      logoGlow.style.transform = 'scale(1)';
      logoGlow.style.boxShadow =
        '0 0 ' + gs + 'px rgba(255,220,80,' + ga + '), 0 0 ' + Math.round(gs * 1.6) + 'px rgba(255,180,20,' + outer + ')';
    }

    function startWaitingPulse() {
      if (waitingPulse) return;
      waitingPulse = true;

      const pulseStart = performance.now();
      function pulse(now) {
        if (!waitingPulse) return;
        const t = (now - pulseStart) / 1000;
        const intensity = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * Math.PI * 1.1));
        applyLogoGlow(intensity);
        pulseRaf = requestAnimationFrame(pulse);
      }
      pulseRaf = requestAnimationFrame(pulse);
    }

    function stopWaitingPulse() {
      waitingPulse = false;
      if (pulseRaf) {
        cancelAnimationFrame(pulseRaf);
        pulseRaf = null;
      }
    }

    function onParentMessage(event) {
      const data = event && event.data;
      if (data && data.type === 'toodoo-intro-exit') {
        stopWaitingPulse();
      }
    }

    window.addEventListener('message', onParentMessage);
    document.addEventListener('message', onParentMessage);

    function revealLogo(onDone) {
      let p = 0;
      const dur = 520;
      const start = performance.now();
      function step(now) {
        p = Math.min(1, (now - start) / dur);
        const ease = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
        const scale = (0.85 + 0.15 * ease).toFixed(3);
        logoImg.style.opacity = ease.toFixed(3);
        logoImg.style.transform = 'scale(' + scale + ')';
        logoGlow.style.transform = 'scale(' + scale + ')';
        const br = (15 + 85 * ease).toFixed(0);
        const sat = (20 + 80 * ease).toFixed(0);
        const gs = Math.round(6 + ease * 18);
        const ga = (ease * 0.55).toFixed(2);
        logoImg.style.filter =
          'brightness(' + br + '%) saturate(' + sat + '%) drop-shadow(0 0 ' + gs + 'px rgba(255,220,80,' + ga + '))';
        logoGlow.style.opacity = ease.toFixed(3);
        logoGlow.style.boxShadow =
          '0 0 ' + gs + 'px rgba(255,220,80,' + ga + '), 0 0 ' + Math.round(gs * 1.6) + 'px rgba(255,180,20,' + (ease * 0.2).toFixed(2) + ')';
        if (p < 1) requestAnimationFrame(step);
        else onDone();
      }
      requestAnimationFrame(step);
    }

    function showText(onDone) {
      let p = 0;
      const dur = 600;
      const start = performance.now();
      function step(now) {
        p = Math.min(1, (now - start) / dur);
        const ease = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
        brandText.style.opacity = ease.toFixed(3);
        brandText.style.transform = 'translateY(' + (10 - 10 * ease).toFixed(1) + 'px)';
        const glow = Math.round(ease * 24);
        const glowA = (ease * 0.6).toFixed(2);
        brandText.style.textShadow =
          '0 0 ' + glow + 'px rgba(255,220,80,' + glowA + '), 0 0 ' + (glow * 2) + 'px rgba(255,180,20,' + (ease * 0.25).toFixed(2) + ')';
        if (p < 1) requestAnimationFrame(step);
        else onDone();
      }
      requestAnimationFrame(step);
    }

    function playIntro() {
      signalComplete();
      revealLogo(function () {
        showText(function () {
          setTimeout(startWaitingPulse, 300);
        });
      });
    }

    playIntro();
  </script>
</body>
</html>
